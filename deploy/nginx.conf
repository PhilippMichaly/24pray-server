# /etc/nginx/sites-available/24pray (Symlink nach sites-enabled/24pray)
#
# Stand: Produktion 24pray.org nach certbot (Zertifikat, 80->443-Redirect) und
# www->Apex-Umstellung. Die mit "managed by Certbot" markierten Zeilen hat certbot
# geschrieben; bei Erst-Setup ohne Zertifikat siehe deploy/README.md Schritt 7/9.
#
# Diese Datei wird im http-Kontext eingebunden (nginx.conf: include sites-enabled/*),
# deshalb stehen map und log_format hier oben ausserhalb der server-Bloecke.

# Zugriffslog ohne Tokens: kein Query-String ($uri statt $request, also z. B. kein
# ?token= aus Magic-Links, kein sig=/email= aus Abmelde-Links), Einladungs-Tokens im
# Pfad maskiert (Web /join/<token>, API /api/join/<token>), kein Referer (der kann
# beides enthalten).
map $uri $log_uri {
    ~^/join/      /join/***;
    ~^/api/join/  /api/join/***;
    default       $uri;
}

log_format notokens '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $log_uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent" $request_time';

server {
    server_name 24pray.org www.24pray.org 217.154.240.224 _;

    # Kein Versions-Banner (nginx.conf setzt "server_tokens build"; ein zweites
    # server_tokens im http-Kontext waere ein Duplikat, daher hier pro server).
    server_tokens off;
    access_log /var/log/nginx/access.log notokens;

    # Security-Header. Gelten fuer alle locations, solange keine location ein eigenes
    # add_header setzt (nginx vererbt add_header sonst NICHT). Wer einer location
    # ein add_header gibt, muss diese fuenf Zeilen dort wiederholen.
    # CSP bewusst nur frame-ancestors: eine volle CSP braucht unter Next 14 Nonces.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Eine kanonische Host-Adresse: www dauerhaft auf die Apex-Domain
    if ($host = www.24pray.org) {
        return 301 https://24pray.org$request_uri;
    }

    # API unter /api/ (Prefix wird gestrippt) — same-origin, kein CORS nötig
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/24pray.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/24pray.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_tokens off;
    access_log /var/log/nginx/access.log notokens;

    if ($host = www.24pray.org) {
        return 301 https://24pray.org$request_uri;
    } # managed by Certbot

    if ($host = 24pray.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 24pray.org www.24pray.org 217.154.240.224 _;
    return 404; # managed by Certbot
}
